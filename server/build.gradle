plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.imbank'
version = '0.1.0-SNAPSHOT'
description = '금융문서 민감정보 점검 웹 서비스 백엔드 (docguard)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    // 이 PC 의 Docker Engine 29(API 최소 1.40)와 통신하려면 Spring Boot BOM 기본값보다 높은 1.21.4 가 필요합니다.
    set('testcontainers.version', '1.21.4')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // 업로드한 PDF 의 쪽수와 암호 여부 확인 (SECURITY.md 4장)
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources') {
    // 배포용 jar 에 React 빌드를 넣습니다: gradlew bootJar -PwebDist=../web/dist (deploy/deploy.sh)
    if (project.hasProperty('webDist')) {
        from(project.property('webDist')) {
            into 'static'
        }
    }
}

tasks.named('bootRun') {
    // 로컬 실행 기본 프로필은 local 입니다. local 프로필이 IM-BANK/.env 를 읽습니다.
    systemProperty 'spring.profiles.active', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'local'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
